<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tune into live radio stations from every country.">
<title>World Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c2a26; --panel:#12372f; --line:#1f4d43; --ink:#e9efe0; --mute:#8fb0a3;
  --sig:#f4d03f; --on-sig:#0c2a26; --bad:#ff8a6b;
  --deck-h:132px;
}
[data-theme=light]{
  --bg:#e4eedf; --panel:#f3f8ef; --line:#c3d6c6; --ink:#0c2a26; --mute:#4f7468;
  --sig:#f4d03f; --on-sig:#0c2a26; --bad:#b53a1c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-bottom:var(--deck-h)}
body{font:400 16px/1.5 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(var(--deck-h) + 24px);transition:background .25s,color .25s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{display:flex;align-items:center;gap:20px;padding:18px clamp(16px,4vw,40px);position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.brand{font:700 1.15rem 'Unbounded',sans-serif;letter-spacing:-.02em;white-space:nowrap}
.brand b{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--sig);margin-right:.45em;vertical-align:-.05em;box-shadow:0 0 0 4px var(--line)}
.find{flex:1;max-width:560px;position:relative}
.find input{width:100%;padding:11px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel)}
.find input:focus{border-color:var(--sig);outline:0}
.find input::placeholder{color:var(--mute)}
.chip{padding:9px 14px;border-radius:10px;border:2px solid var(--line);font-weight:500}
.chip:hover{border-color:var(--sig)}

.layout{display:grid;grid-template-columns:270px 1fr;gap:clamp(16px,3vw,40px);padding:24px clamp(16px,4vw,40px);max-width:1360px;margin:auto}
aside{position:sticky;top:92px;align-self:start;max-height:calc(100vh - 92px - var(--deck-h) - 20px);display:flex;flex-direction:column;gap:10px}
#cfilter{padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:transparent;width:100%}
#cfilter:focus{border-color:var(--sig);outline:0}
#countries{overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.c{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;text-align:left}
.c small{color:var(--mute);font-size:.8rem;align-self:center}
.c:hover{background:var(--panel)}
.c[aria-current=true]{background:var(--sig);color:var(--on-sig);font-weight:700}
.c[aria-current=true] small{color:inherit}
.c.favs{border:2px dashed var(--line);margin-bottom:6px}
.c.favs[aria-current=true]{border-style:solid;border-color:var(--sig)}

h1{font:700 clamp(1.6rem,3.4vw,2.6rem)/1.1 'Unbounded',sans-serif;letter-spacing:-.03em;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:22px}
.msg{padding:40px 0;color:var(--mute)}
.msg.err{color:var(--bad)}

/* Station rows */
#list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px}
.row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--panel);border:2px solid transparent;cursor:pointer}
.row:hover{border-color:var(--line)}
.row.on{border-color:var(--sig)}
.tile{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font:700 .95rem 'Unbounded',sans-serif;color:var(--on-sig)}
.meta{min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:6px}
.freq{font:500 .85rem 'Unbounded',sans-serif;font-variant-numeric:tabular-nums;color:var(--sig)}
[data-theme=light] .freq{color:var(--ink)}
.star{font-size:1.35rem;color:var(--mute);width:38px;height:38px;border-radius:10px}
.star:hover{background:var(--line)}
.star.is{color:var(--sig)}
[data-theme=light] .star.is{color:#c59b00}

.deck{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--panel);border-top:2px solid var(--line)}
.dial{position:relative;height:30px;margin:0 clamp(16px,4vw,40px);border-bottom:2px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px 12px) bottom/100% 8px no-repeat,
             repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 60px) bottom/100% 16px no-repeat;opacity:.9}
.dial span{position:absolute;top:3px;font-size:.7rem;color:var(--mute);transform:translateX(-50%)}
.needle{position:absolute;bottom:-2px;left:50%;width:4px;height:34px;background:var(--sig);border-radius:2px;transition:left .9s cubic-bezier(.3,1.3,.5,1);box-shadow:0 0 12px var(--sig)}
.deckrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px clamp(16px,4vw,40px) 14px}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.eq{display:flex;align-items:flex-end;gap:3px;height:26px;width:26px;flex:none}
.eq i{flex:1;background:var(--sig);border-radius:2px;height:20%}
.playing .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:100%}}
.now div{min-width:0}
#nName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nState{font-size:.85rem;color:var(--mute)}
#nState.err{color:var(--bad)}
.ctl{display:flex;align-items:center;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem}
.ib:hover{background:var(--line)}
.ib.play{width:54px;height:54px;background:var(--sig);color:var(--on-sig);font-size:1.3rem}
.ib.play:hover{filter:brightness(1.08)}
.opts{display:flex;justify-content:flex-end;align-items:center;gap:10px;position:relative}
#vol{width:110px;accent-color:var(--sig)}
#tbtn.active{background:var(--sig);color:var(--on-sig);border-color:var(--sig)}
.pop{position:absolute;right:0;bottom:calc(100% + 12px);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;width:230px;display:none}
.pop.open{display:block}
.pop p{margin-bottom:8px;font-weight:700}
.pop .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pop button{padding:8px;border-radius:8px;border:2px solid var(--line)}
.pop button:hover{border-color:var(--sig)}
.pop .off{grid-column:1/-1;margin-top:4px;color:var(--bad)}

@media(max-width:820px){
  :root{--deck-h:176px}
  .top{flex-wrap:wrap;gap:12px}.find{order:3;flex-basis:100%;max-width:none}
  .layout{grid-template-columns:1fr;padding-top:16px}
  aside{position:static;max-height:none}
  #countries{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .c{flex:none;border:2px solid var(--line)}
  .deckrow{grid-template-columns:1fr auto;grid-template-areas:"now now" "ctl opts"}
  .now{grid-area:now}.ctl{grid-area:ctl}.opts{grid-area:opts}
  #vol{width:80px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b></b>World Radio</div>
  <div class="find">
    <label class="sr" for="q">Search stations</label>
    <input id="q" type="search" placeholder="Station, genre or frequency (press / to search)" autocomplete="off">
  </div>
  <button class="chip" id="theme" aria-label="Toggle light or dark theme">Light</button>
</header>

<div class="layout">
  <aside aria-label="Countries">
    <label class="sr" for="cfilter">Filter countries</label>
    <input id="cfilter" type="search" placeholder="Filter countries" autocomplete="off">
    <nav id="countries"></nav>
  </aside>
  <main>
    <h1 id="title">Loading</h1>
    <p class="sub" id="sub"></p>
    <ul id="list" aria-live="polite"></ul>
    <p class="msg" id="msg" hidden></p>
  </main>
</div>

<footer class="deck" id="deck">
  <div class="dial" aria-hidden="true">
    <span style="left:6%">88</span><span style="left:26%">92</span><span style="left:46%">96</span><span style="left:66%">100</span><span style="left:86%">104</span>
    <div class="needle" id="needle"></div>
  </div>
  <div class="deckrow">
    <div class="now">
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div><div id="nName">Pick a station</div><div id="nState" role="status">Choose a country or search above.</div></div>
    </div>
    <div class="ctl">
      <button class="ib" id="prev" aria-label="Previous station">&#9198;</button>
      <button class="ib play" id="pp" aria-label="Play">&#9654;</button>
      <button class="ib" id="next" aria-label="Next station">&#9197;</button>
    </div>
    <div class="opts">
      <label class="sr" for="vol">Volume</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button class="chip" id="tbtn" aria-expanded="false" aria-controls="pop">Sleep timer</button>
      <div class="pop" id="pop">
        <p id="tTitle">Stop playback in</p>
        <div class="g">
          <button data-m="15">15 min</button><button data-m="30">30 min</button><button data-m="60">1 hour</button>
          <button data-m="90">90 min</button><button data-m="120">2 hours</button><button data-m="180">3 hours</button>
          <button class="off" id="toff" hidden>Cancel timer</button>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
</footer>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const HOSTS = ['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const audio = $('#audio'), list = $('#list'), msg = $('#msg');
const S = { list: [], cur: null, view: null, countries: [], favs: store.get('wr.favs', []), vol: store.get('wr.vol', 70), fails: 0, urls: [], ui: 0 };

let mirror = 0, ctrl = null;
async function api(path, signal){
  let err;
  for (let i = 0; i < HOSTS.length; i++){
    const k = (mirror + i) % HOSTS.length;
    try {
      const r = await fetch(HOSTS[k] + path, { signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      mirror = k; return await r.json();
    } catch (e) { if (e.name === 'AbortError') throw e; err = e; }
  }
  throw err;
}
const clean = arr => {
  const seen = new Set();
  return arr.filter(s => {
    const u = (s.url_resolved || '').trim();
    if (!u || !s.name || !s.name.trim() || seen.has(u) || /\.(html?|php|asp)(\?|$)/i.test(u)) return false;
    seen.add(u); return true;
  }).sort((a, b) => (b.votes || 0) - (a.votes || 0));
};
const Q = 'hidebroken=true&order=votes&reverse=true';

const freqOf = s => { const m = (s.name + ' ' + (s.tags || '')).match(/\b(8[7-9]|9\d|10[0-8])[.,](\d)\b/); return m ? parseFloat(m[1] + '.' + m[2]) : null; };
const hue = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'FM';
const isFav = s => S.favs.some(f => f.stationuuid === s.stationuuid);
const slim = s => ({ stationuuid: s.stationuuid, name: s.name, url_resolved: s.url_resolved, countrycode: s.countrycode, country: s.country, tags: s.tags, bitrate: s.bitrate });

function setHead(t, s){ $('#title').textContent = t; $('#sub').textContent = s || ''; }
function showMsg(t, err){ msg.hidden = !t; msg.textContent = t || ''; msg.className = 'msg' + (err ? ' err' : ''); }
function render(){
  list.innerHTML = S.list.map((s, i) => {
    const f = freqOf(s), tag = (s.tags || '').split(',')[0].trim(), h = hue(s.name);
    return `<li class="row${S.cur && S.cur.stationuuid === s.stationuuid ? ' on' : ''}" data-i="${i}" data-id="${esc(s.stationuuid)}">
      <div class="tile" style="background:hsl(${h} 70% 68%)">${esc(initials(s.name))}</div>
      <div class="meta"><b>${esc(s.name.trim())}</b><small>${esc(s.country || s.countrycode || '')}${tag ? ', ' + esc(tag) : ''}${s.bitrate ? ', ' + s.bitrate + ' kbps' : ''}</small></div>
      <div class="right">${f ? `<span class="freq">${f.toFixed(1)}</span>` : ''}
        <button class="star${isFav(s) ? ' is' : ''}" data-fav aria-pressed="${isFav(s)}" aria-label="Favorite ${esc(s.name.trim())}">&#9733;</button></div></li>`;
  }).join('');
}
function markActive(){
  list.querySelectorAll('.row').forEach(r => r.classList.toggle('on', !!S.cur && r.dataset.id === S.cur.stationuuid));
}

async function load(view, title, sub, path){
  S.view = view; setHead(title, sub); showMsg('Tuning in...'); list.innerHTML = '';
  document.querySelectorAll('.c').forEach(c => c.setAttribute('aria-current', c.dataset.v === view));
  if (ctrl) ctrl.abort(); ctrl = new AbortController();
  try {
    const data = await path(ctrl.signal);
    S.list = clean(data).slice(0, 80);
    showMsg(S.list.length ? '' : 'No working stations found. Try another search or country.');
    setHead(title, S.list.length ? S.list.length + ' stations, most voted first' : '');
    render();
  } catch (e) {
    if (e.name !== 'AbortError') showMsg('Could not reach the station directory. Check your connection and try again.', true);
  }
}
const openCountry = c => { store.set('wr.cc', c.iso_3166_1); load('c:' + c.iso_3166_1, c.name, '', sg => api(`/json/stations/search?countrycode=${encodeURIComponent(c.iso_3166_1)}&${Q}&limit=100`, sg)); };
function openFavs(){
  S.view = 'favs'; if (ctrl) ctrl.abort(); S.list = S.favs.slice();
  document.querySelectorAll('.c').forEach(c => c.setAttribute('aria-current', c.dataset.v === 'favs'));
  setHead('Favorites', S.list.length ? S.list.length + ' saved stations' : ''); render();
  showMsg(S.list.length ? '' : 'No favorites yet. Select the star on any station to keep it here.');
}
function search(v){
  const e = encodeURIComponent(v);
  load('q', 'Results for "' + v + '"', '', async sg => {
    const [a, b] = await Promise.all([api(`/json/stations/search?name=${e}&${Q}&limit=60`, sg), api(`/json/stations/search?tag=${e}&${Q}&limit=60`, sg)]);
    return a.concat(b);
  });
}

function renderCountries(filter = ''){
  const f = filter.toLowerCase();
  $('#countries').innerHTML = `<button class="c favs" data-v="favs"${S.view === 'favs' ? ' aria-current="true"' : ''}>Favorites <small>${S.favs.length}</small></button>` +
    S.countries.filter(c => c.name.toLowerCase().includes(f)).map(c =>
      `<button class="c" data-v="c:${esc(c.iso_3166_1)}" data-cc="${esc(c.iso_3166_1)}"${S.view === 'c:' + c.iso_3166_1 ? ' aria-current="true"' : ''}>${esc(c.name)} <small>${c.stationcount}</small></button>`).join('');
}
async function init(){
  try {
    const data = await api('/json/countries');
    S.countries = data.filter(c => c.stationcount > 0 && c.iso_3166_1).sort((a, b) => b.stationcount - a.stationcount);
  } catch { showMsg('Could not load the country list.', true); setHead('World Radio'); return; }
  renderCountries();
  const region = (navigator.language.split('-')[1] || '').toUpperCase();
  const pick = S.countries.find(c => c.iso_3166_1 === store.get('wr.cc', region)) || S.countries.find(c => c.iso_3166_1 === 'FR') || S.countries[0];
  openCountry(pick); renderCountries($('#cfilter').value);
  const last = store.get('wr.last', null);
  if (last){ S.cur = last; showNow(last, 'Ready. Press play to resume.'); }
}

function showNow(s, state, err){
  $('#nName').textContent = s.name.trim();
  const st = $('#nState'); st.textContent = state; st.className = err ? 'err' : '';
  const f = freqOf(s);
  $('#needle').style.left = (f ? 4 + (f - 87.5) / 20.5 * 92 : 4 + hue(s.name) / 360 * 92) + '%';
  document.title = s.name.trim() + ' | World Radio';
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.name.trim(), artist: s.country || 'World Radio' });
  }
}
function play(s){
  S.cur = s; S.fails = S.fails; store.set('wr.last', slim(s));
  const u = s.url_resolved;
  S.urls = location.protocol === 'https:' && u.startsWith('http:') ? [u.replace('http:', 'https:'), u] : [u];
  tryNext(s); markActive();
}
function tryNext(s){
  const u = S.urls.shift();
  if (!u) return failed(s);
  audio.src = u; audio.volume = S.vol / 100;
  showNow(s, 'Connecting...');
  audio.play().catch(() => {});
}
function failed(s){
  S.fails++;
  showNow(s, 'This stream is offline.' + (S.fails < 4 && S.list.length > 1 ? ' Trying the next one...' : ''), true);
  document.body.classList.remove('playing');
  if (S.fails < 4 && S.list.length > 1) setTimeout(() => step(1), 1200);
}
function idx(){ return S.list.findIndex(x => S.cur && x.stationuuid === S.cur.stationuuid); }
function step(d){
  if (!S.list.length) return;
  const i = idx(); play(S.list[(i < 0 ? (d > 0 ? 0 : S.list.length - 1) : (i + d + S.list.length) % S.list.length)]);
}
function toggle(){
  if (!S.cur) return;
  if (audio.paused){ if (!audio.src) play(S.cur); else audio.play().catch(() => play(S.cur)); } else audio.pause();
}
audio.addEventListener('playing', () => { S.fails = 0; document.body.classList.add('playing'); $('#pp').innerHTML = '&#9208;'; $('#pp').setAttribute('aria-label', 'Pause'); showNow(S.cur, 'On air' + (S.cur.bitrate ? ', ' + S.cur.bitrate + ' kbps' : '')); });
audio.addEventListener('pause', () => { document.body.classList.remove('playing'); $('#pp').innerHTML = '&#9654;'; $('#pp').setAttribute('aria-label', 'Play'); if (S.cur && !audio.ended && audio.src) $('#nState').textContent = 'Paused'; });
audio.addEventListener('waiting', () => { if (S.cur) $('#nState').textContent = 'Buffering...'; });
audio.addEventListener('error', () => { if (S.cur) S.urls.length ? tryNext(S.cur) : failed(S.cur); });
$('#pp').onclick = toggle; $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
$('#vol').value = S.vol;
$('#vol').oninput = e => { S.vol = +e.target.value; audio.volume = S.vol / 100; store.set('wr.vol', S.vol); };
if ('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', toggle);
  navigator.mediaSession.setActionHandler('pause', toggle);
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
}

let tEnd = 0, tInt = null;
function tStop(){
  clearInterval(tInt); tInt = null; tEnd = 0; audio.volume = S.vol / 100;
  $('#tbtn').textContent = 'Sleep timer'; $('#tbtn').classList.remove('active'); $('#toff').hidden = true;
}
function tStart(min){
  tStop(); tEnd = Date.now() + min * 60000; $('#toff').hidden = false; $('#tbtn').classList.add('active');
  const tick = () => {
    const left = Math.round((tEnd - Date.now()) / 1000);
    if (left <= 0){ audio.pause(); tStop(); return; }
    if (left <= 10) audio.volume = S.vol / 100 * left / 10;
    $('#tbtn').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  };
  tick(); tInt = setInterval(tick, 1000); $('#pop').classList.remove('open');
}
$('#tbtn').onclick = () => { const o = $('#pop').classList.toggle('open'); $('#tbtn').setAttribute('aria-expanded', o); };
$('#pop').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) tStart(+b.dataset.m); });
$('#toff').onclick = () => { tStop(); $('#pop').classList.remove('open'); };
document.addEventListener('click', e => { if (!e.target.closest('.opts')) $('#pop').classList.remove('open'); });

list.addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const s = S.list[+row.dataset.i];
  if (e.target.closest('[data-fav]')){
    S.favs = isFav(s) ? S.favs.filter(f => f.stationuuid !== s.stationuuid) : S.favs.concat(slim(s));
    store.set('wr.favs', S.favs);
    if (S.view === 'favs'){ openFavs(); } else { e.target.closest('[data-fav]').classList.toggle('is', isFav(s)); }
    renderCountries($('#cfilter').value); return;
  }
  play(s);
});
$('#countries').addEventListener('click', e => {
  const b = e.target.closest('.c'); if (!b) return;
  if (b.dataset.v === 'favs') openFavs(); else openCountry(S.countries.find(c => c.iso_3166_1 === b.dataset.cc));
  $('#q').value = '';
});
$('#cfilter').oninput = e => renderCountries(e.target.value);
let deb;
$('#q').addEventListener('input', e => {
  clearTimeout(deb); const v = e.target.value.trim();
  if (v.length < 2) return;
  deb = setTimeout(() => search(v), 350);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape'){ e.target.value = ''; e.target.blur(); } });

function theme(t){ document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; store.set('wr.theme', t); }
$('#theme').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
theme(store.get('wr.theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

document.addEventListener('keydown', e => {
  if (e.target.closest('input,button') && e.key !== '/') return;
  if (e.key === ' '){ e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === '/'){ e.preventDefault(); $('#q').focus(); }
});

init();
})();
</script>
</body>
</html>
